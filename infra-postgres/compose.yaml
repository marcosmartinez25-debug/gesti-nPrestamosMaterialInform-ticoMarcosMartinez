services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: dwes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Define la clave admin}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - datos_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dwes"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  datos_pg:
